
[general]
live_config_reload = true

import = [ "~/.local/share/kanagawa.nvim/extras/alacritty/kanagawa_dragon.toml" ]

[window]
decorations = "Full"
dynamic_padding = false
opacity = 0.95
startup_mode = "Maximized"

[window.padding]
x = 6
y = 6

[cursor.style]
shape = "Block"

[env]
TERM = "xterm-256color"

[font]
size = 12.0
offset = { x = 0, y = -1 }

[font.normal]
family = "SauceCodePro Nerd Font Mono"
style = "Regular"

[font.bold]
family = "SauceCodePro Nerd Font Mono"
style = "SemiBold"

[font.bold_italic]
family = "SauceCodePro Nerd Font Mono"
style = "SemiBoldItalic"

[font.italic]
family = "SauceCodePro Nerd Font Mono"
style = "Italic"
